site_name: EchoSphere
site_url: https://mauricekuenicke.github.io/EchoSphere/
site_author: Maurice Künicke
edit_uri: edit/main/docs/
repo_url: https://github.com/MauriceKuenicke/EchoSphere
repo_name: MauriceKuenicke/EchoSphere
theme:
  icon:
    logo: material/sphere
    repo: fontawesome/brands/github

  language: en

  name: material
  custom_dir: docs/overrides

  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

  palette:
    scheme: default
    primary: blue grey
    accent: teal

  features:
    - search.suggest
    - search.share
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Why EchoSphere:
      - Overview: why-echosphere/index.md
      - EchoSphere vs Soda: why-echosphere/vs-soda.md
      - EchoSphere in the AI Era: why-echosphere/ai-era.md
  - Getting Started:
      - Overview: getting-started/index.md
  - User Guide:
      - Overview: user-guide/index.md
      - Writing Tests: writing-tests/index.md
      - Using Fully-Qualified Table Names: user-guide/using_qualified_names.md
      - Command Reference: command-reference/index.md
  - Reference:
      - Configuration: reference/configuration.md
      - Environment Variables: reference/environment-variables.md
      - SQL Testing Syntax: reference/sql-testing-syntax.md
      - API Usage: reference/api-usage.md
  - Advanced Topics:
      - CI/CD Integration: advanced/ci-cd.md
      - Performance: advanced/performance.md
      - Large-Scale Management: advanced/large-scale.md
  - Examples & Tutorials:
      - Cookbook: examples/cookbook.md
      - Tutorial Setup Walkthrough: examples/tutorial-setup.md
  - Supported Platforms: supported-platforms/index.md
  - Troubleshooting: troubleshooting/index.md
  - Contributing: contributing.md

copyright: Copyright &copy; 2025 - Maurice Künicke

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MauriceKuenicke
      name: Maurice on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/maurice-k%C3%BCnicke-429a211a3/
      name: Maurice on LinkedIn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
